<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vibe</title>

  <script src="theme.js" data-shell></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <iframe id="view" title="Vibe" allow="autoplay"></iframe>

  <script>
    (function () {
      /* first page to open (change Index.html if your home file has another name) */
      var page = "Index.html";
      var q = new URLSearchParams(location.search).get("page");
      if (q && /^[A-Za-z0-9_.\-]+\.html([?#].*)?$/i.test(q)) page = q;
      document.getElementById("view").src = page;
    })();
  </script>
</body>
</html>
