  <!-- Hidden until the login check finishes (no flash) -->
  <style>html { visibility: hidden; }</style>

  <style>
    /* BODY */
    body {
      background-image: url("file_000000006c748211a247756d7731b785.png");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 97vh;
      margin: 0;
      padding-bottom: 60px;
    }

    /* TOP BAR */
    #one {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    .one1 { display: flex; gap: 8px; }

    .im {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      margin-top: 3.4px;
    }

    #two { margin-top: 3.4px; gap: 25px; }

    /* SEARCH */
    #three {
      border-radius: 7px;
      margin-left: 5px;
      width: 30%;
      height: 35px;
      border: none;
      padding-left: 10px;
      outline: none;
      box-sizing: border-box;
    }

    /* THEMES */
    :root {
      color-scheme: dark;
      --bg: #000000;
      --card: #212121;
      --text: #ffffff;
      --accent: #fb4242;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f4f4f4;
      --card: #e5e5e5;
      --text: #171717;
      --accent: #e73c3c;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
    }

    .email, .password, .picture, .card, .theme, .notification {
      background-color: var(--card);
      color: var(--text);
    }

    button { color: var(--accent); }

    /* GENRE CONTAINER */
    #four {
      display: flex;
      flex-direction: row;
      gap: 5px;
      width: 100%;
      height: 200px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 3px;
      box-sizing: border-box;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    #four::-webkit-scrollbar { display: none; }

    /* GENRE BOXES */
    #five, #five1, #five2, #five3, #five4, #five5, #five6 {
      flex-shrink: 0;
      height: 100%;
      width: 30%;
      margin-left: 15px;
      border-radius: 10px;
      color: white;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      box-sizing: border-box;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      padding: 5px;
      background-position: center;
    }

    #five  { background-image: url("telugu.jpg");    background-size: cover; }
    #five1 { background-image: url("hindi.jpg");     background-size: cover; }
    #five2 { background-image: url("english.jpg");   background-size: cover; }
    #five3 { background-image: url("tamil.jpg");     background-size: cover; }
    #five4 { background-image: url("malyalam.webp"); background-size: cover; }
    #five5 { background-image: url("kannada.webp");  background-size: cover; }
    #five6 { background-image: url("weeknd.jpeg");   background-size: cover; }

    #five h3, #five1 h3, #five2 h3, #five3 h3,
    #five4 h3, #five5 h3, #five6 h3 {
      margin: 0;
      text-align: center;
      margin-bottom: 5px;
      color: white;
      text-shadow: 0 1px 4px black, 0 1px 8px black;
    }

    #five:hover  { transform: scale(1.05); box-shadow: 0 0 8px hwb(27 34% 0%); }
    #five1:hover { transform: scale(1.05); box-shadow: 0 0 8px hwb(0 6% 7%); }
    #five2:hover { transform: scale(1.05); box-shadow: 0 0 8px hwb(8 21% 2%); }
    #five3:hover { transform: scale(1.05); box-shadow: 0 0 8px hwb(0 31% 60%); }
    #five4:hover { transform: scale(1.05); box-shadow: 0 0 8px white; }
    #five5:hover { transform: scale(1.05); box-shadow: 0 0 8px darkorange; }
    #five6:hover { transform: scale(1.02); box-shadow: 0 0 8px grey; }

    /* RECENTLY PLAYED */
    #recentlyPlayed {
      width: 100%;
      margin-top: 25px;
      padding-bottom: 80px;
    }

    #recentTitle {
      color: white;
      margin-left: 5px;
    }

    #recentSongs { width: 100%; }

    /* SONG CARD */
    .song-card {
      display: flex;
      align-items: center;
      gap: 12px;
      width: calc(100% - 20px);
      margin: 10px auto;
      padding: 10px;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.50);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: white;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .song-card:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .song-card:active { transform: scale(0.98); }

    .song-card img {
      width: 65px;
      height: 65px;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      object-fit: cover;
      object-position: center;
      border-radius: 8px;
    }

    .song-info { flex: 1; min-width: 0; }

    .song-title {
      font-size: 17px;
      font-weight: bold;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 13px;
      color: white;
      opacity: 0.75;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .recent-play {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
    }

    .recent-play:active { transform: scale(0.90); }

    #loading, #noRecent {
      color: white;
      text-align: center;
      margin-top: 20px;
    }

    /* BOTTOM NAVIGATION */
    #down {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40px;
      box-sizing: border-box;
      background: #212121;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      padding: 5px;
    }

    #home {
      font-size: 35px;
      margin-left: 10px;
      line-height: 1;
      color: silver;
    }

    .pre { margin-right: 10px; }

    .none {
      background: none;
      border: none;
    }

    button { position: relative; }

    button:active::after {
      display: none;
    }

    #down h4 {
      margin: 0;
      color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
    }
/* FIX LIGHT THEME BACKGROUND */

:root[data-theme="light"],
:root[data-theme="light"] body {
  background: #f4f4f4 !important;

}
    /* MOBILE */
    @media (max-width: 600px) {
      #one { padding: 0 8px; }
      #three { width: 75%; }
      #four { gap: 5px; height: 100px; }

      #five, #five1, #five2, #five3, #five4, #five5, #five6 {
        width: 100px;
        height: 100px;
        margin-left: 10px;
      }

      .song-card { width: calc(100% - 10px); }
      .song-card img { width: 60px; height: 60px; }
      .song-title { font-size: 16px; }
      .song-artist { font-size: 12px; }
    }

    /* LIGHT THEME FIXES */
    :root[data-theme="light"] {
      --bg: #f4f4f4;
      --card: #ffffff;
      --text: #171717;
      --accent: #171717;
      --icon: #171717;
    }

    :root:not([data-theme="light"]) {
      --icon: #ffffff;
    }

    :root[data-theme="light"] body {
      background-color: var(--bg);
      color: var(--text);
    }

    :root[data-theme="light"] #one h3,
    :root[data-theme="light"] h1,
    :root[data-theme="light"] body > h3,
    :root[data-theme="light"] #recentTitle,
    :root[data-theme="light"] #loading,
    :root[data-theme="light"] #noRecent,
    :root[data-theme="light"] .song-title,
    :root[data-theme="light"] .song-artist {
      color: #171717 !important;
    }

    :root[data-theme="light"] #two a {
      color: #171717 !important;
    }

    :root[data-theme="light"] #two svg {
      stroke: #171717 !important;
    }

    :root[data-theme="light"] #three {
      background: #ffffff;
      color: #171717;
      border: 1px solid #dedede;
    }

    :root[data-theme="light"] #three::placeholder {
      color: #777777;
    }

    :root[data-theme="light"] .song-card {
      background: #ffffff;
      border: 1px solid #dddddd;
      color: #171717;
    }

    :root[data-theme="light"] .song-card:hover {
      background: #f8f8f8;
    }

    :root[data-theme="light"] .recent-play {
      background: #eeeeee;
      color: #171717;
      border: 1px solid #cccccc;
    }

    :root[data-theme="light"] #down {
      background: #e5e5e5;
    }

    :root[data-theme="light"] #down svg [fill="silver"] {
      fill: #171717 !important;
    }

    :root[data-theme="light"] #down svg [stroke="silver"] {
      stroke: #171717 !important;
    }

    :root[data-theme="light"] #home {
      color: #171717 !important;
    }

    :root[data-theme="light"] #down h4,
    :root[data-theme="light"] #down h4 svg {
      color: #171717 !important;
    }

    :root[data-theme="light"] #down h4 svg path {
      stroke: #171717 !important;
    }

    :root[data-theme="light"] button {
      color: #171717;
    }

  </style>

      let session = null;

      try {
        const { data } = await supabaseClient.auth.getSession();
        session = data.session;
      } catch (e) {
        console.error(e);
      }

      if (!session) {
        window.location.replace("login.html");
        return;
      }

      document.documentElement.style.visibility = "visible";

      const meta = session.user.user_metadata || {};

      VibeAvatar.sync(
        supabaseClient,
        "music vibe2",
        meta.avatar_path,
        meta.avatar_ver,
        avatarEl
      );

    })();

    async function logout() {

      if (window.VibePlayer) VibePlayer.stop();

      await supabaseClient.auth.signOut();

      VibeAvatar.clear();

      window.location.replace("login.html");
    }

    /* VARIABLES */
    let allSongs = [];
    let lastSongId = null;

    /* LOAD SONGS */
    async function loadSongs() {

      const { data, error } = await supabaseClient
        .from("songs")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        console.error("Error loading songs:", error);
        return;
      }

      allSongs = data || [];

      displayRecentlyPlayed();
    }

    /* GENRE NAVIGATION */
    function music() {
      window.location.href = "language.html?lang=Telugu";
    }

    function music1() {
      window.location.href = "language.html?lang=Hindi";
    }

    function music2() {
      window.location.href = "language.html?lang=English";
    }

    function music3() {
      window.location.href = "language.html?lang=Tamil";
    }

    function music4() {
      window.location.href = "language.html?lang=Malayalam";
    }

    function music5() {
      window.location.href = "language.html?lang=Kannada";
    }

    /* HELPERS */
    function getRecent() {

      try {
        return JSON.parse(localStorage.getItem("vibeRecentlyPlayed")) || [];
      } catch (e) {
        return [];
      }

    }

    /* CREATE SONG CARD */
    function createRecentCard(song, list) {

      const card = document.createElement("div");
      card.className = "song-card";

      const cover = document.createElement("img");
      cover.src = song.cover_url || "https://via.placeholder.com/65";
      cover.alt = song.title || "Song";

      const info = document.createElement("div");
      info.className = "song-info";

      const title = document.createElement("div");
      title.className = "song-title";
      title.textContent = song.title || "Unknown Song";

      const artist = document.createElement("div");
      artist.className = "song-artist";
      artist.textContent = song.artist || "Unknown Artist";

      info.appendChild(title);
      info.appendChild(artist);

      const button = document.createElement("button");
      button.className = "recent-play";
      button.dataset.songId = song.id;
      button.textContent = "▶";

      /* PLAY / PAUSE BUTTON */
      button.onclick = function (event) {

        event.stopPropagation();

        const st = VibePlayer.state();

        if (st.song && String(st.song.id) === String(song.id)) {
          VibePlayer.toggle(song, list);
        } else {
          VibePlayer.play(song, list);
        }

      };

      /* OPEN PLAY CARD */
      card.onclick = function () {
        VibePlayer.play(song, list);
      };

      card.appendChild(cover);
      card.appendChild(info);
      card.appendChild(button);

      return card;
    }

    /* DISPLAY RECENTLY PLAYED */
    function displayRecentlyPlayed() {

      const container = document.getElementById("recentSongs");
      const noRecent = document.getElementById("noRecent");

      let recent = getRecent();

      if (allSongs.length) {

        recent = recent.filter(r =>
          allSongs.some(s => String(s.id) === String(r.id))
        );

        localStorage.setItem(
          "vibeRecentlyPlayed",
          JSON.stringify(recent)
        );

      }

      container.innerHTML = "";

      if (recent.length === 0) {

        noRecent.textContent = "No recently played songs.";
        noRecent.style.display = "block";

        return;
      }

      noRecent.style.display = "none";

      recent.forEach(song => {
        container.appendChild(createRecentCard(song, recent));
      });

      updateRecentButtons();
    }

    /* UPDATE PLAY BUTTONS */
    function updateRecentButtons() {

      const st = VibePlayer.state();

      document.querySelectorAll(".recent-play").forEach(button => {

        const isCurrent =
          st.song && String(st.song.id) === button.dataset.songId;

        button.textContent =
          (isCurrent && st.playing) ? "❚❚" : "▶";

      });

    }

    /* KEEP BUTTONS IN SYNC */
    window.addEventListener("vibeplayer", function (e) {

      const id = e.detail.songId;

      if (String(id) !== String(lastSongId)) {

        lastSongId = id;

        if (!document.getElementById("three").value.trim()) {
          displayRecentlyPlayed();
        }

      }

      updateRecentButtons();

    });

    /* SEARCH */
    document.getElementById("three").addEventListener("input", function () {

      const text = this.value.toLowerCase().trim();

      const container = document.getElementById("recentSongs");
      const noRecent = document.getElementById("noRecent");

      if (!text) {
        displayRecentlyPlayed();
        return;
      }

      const results = allSongs.filter(song => {

        const title = (song.title || "").toLowerCase();
        const artist = (song.artist || "").toLowerCase();
        const album = (song.album || "").toLowerCase();

        return title.includes(text) ||
               artist.includes(text) ||
               album.includes(text);

      });

      container.innerHTML = "";

      if (results.length === 0) {

        noRecent.style.display = "block";
        noRecent.textContent = "No songs found.";

        return;
      }

      noRecent.style.display = "none";

      results.forEach(song => {
        container.appendChild(createRecentCard(song, results));
      });

      updateRecentButtons();

    });

    /* REALTIME */
    supabaseClient
      .channel("songs-realtime")
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "songs" },
        payload => {

          console.log("Database changed:", payload.eventType);

          loadSongs();

        }
      )
      .subscribe();

    /* START */
    loadSongs();

  </script>



</body>
